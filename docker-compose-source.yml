# Used by start.sh --source-url. Requires Compose 2.24.4+ for !override.
services:
  ctfd:
    image: ctfd-https-source:local
    pull_policy: never
    build:
      context: ${CTFD_SOURCE_URL:?Set CTFD_SOURCE_URL to a public HTTPS Git URL}
    depends_on:
      source-permissions:
        condition: service_completed_successfully
    environment:
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/ctfd
    # Use the selected source's themes, including its compiled frontend assets.
    volumes: !override
      - ./ctfd/logs:/var/log/ctfd
      - ./ctfd/uploads:/var/uploads

  # The upstream Dockerfile runs as UID 1001; host directories may be new.
  source-permissions:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - ./ctfd/logs:/var/log/ctfd
      - ./ctfd/uploads:/var/uploads
    entrypoint: ["chown", "-R", "1001:1001", "/var/log/ctfd", "/var/uploads"]
    networks:
      - ctfd-net
