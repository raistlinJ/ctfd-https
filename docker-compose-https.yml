services:
  # -------------------------------------------------
  # Generate self-signed TLS certs (one-time)
  # -------------------------------------------------
  cert-init:
    image: alpine:3.20
    container_name: ctfd-cert-init
    volumes:
      - ./certs:/certs
    entrypoint: >
      sh -c '
      if [ ! -f /certs/fullchain.pem ] || [ ! -f /certs/privkey.pem ]; then
        echo "Generating self-signed TLS certs...";
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -days 3650 \
          -newkey rsa:4096 \
          -keyout /certs/privkey.pem \
          -out /certs/fullchain.pem \
          -subj "/C=US/ST=CTF/L=CTF/O=CTFd/OU=Dev/CN=localhost";
      else
        echo "TLS certs already exist. Skipping.";
      fi
      '
    restart: "no"

  # -------------------------------------------------
  # Nginx HTTPS Reverse Proxy
  # -------------------------------------------------
  nginx:
    # Pin a patched stable release; CVE-2026-42533 is fixed in 1.30.4+.
    image: ${NGINX_IMAGE:-nginx:1.30.5}
    container_name: ctfd-nginx
    restart: unless-stopped
    # Work around docker-default denying UNIX socket creation on this host.
    # Remove after the host's Docker/AppArmor compatibility issue is fixed.
    security_opt:
      - apparmor=unconfined
    depends_on:
      - cert-init
      - ctfd
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ctfd-net

  # -------------------------------------------------
  # CTFd Application with wait-for-DB
  # -------------------------------------------------
  ctfd:
    image: ${CTFD_IMAGE:-ctfd-https-source:local}
    pull_policy: build
    build:
      context: ${CTFD_SOURCE_URL:-https://github.com/raistlinJ/CTFd.git#feature/retract-solves}
    container_name: ctfd
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
      source-permissions:
        condition: service_completed_successfully
    # Created on the host by start.sh before Compose reads this file.
    env_file:
      - ./secrets/.env
    environment:
      DATABASE_URL: ${CTFD_DATABASE_URL:-mysql+pymysql://ctfd:ctfd@db/ctfd}
      REDIS_URL: redis://cache:6379
      WORKERS: ${CTFD_WORKERS:-4}
      REVERSE_PROXY: "true"
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/ctfd
    volumes:
      - ./ctfd/logs:/var/log/ctfd
      - ./ctfd/uploads:/var/uploads
      # Use the selected source's bundled themes and compiled frontend.
    expose:
      - "8000"
    networks:
      - ctfd-net

  # -------------------------------------------------
  # MariaDB
  # -------------------------------------------------
  db:
    image: ${MARIADB_IMAGE:-mariadb:10.11}
    container_name: ctfd-db
    restart: unless-stopped
    # Work around docker-default denying UNIX socket creation on this host.
    # Remove after the host's Docker/AppArmor compatibility issue is fixed.
    security_opt:
      - apparmor=unconfined
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ctfd}
      MYSQL_USER: ${MYSQL_USER:-ctfd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ctfd}
      MYSQL_WAIT_TIMEOUT: 28800
      MYSQL_MAX_ALLOWED_PACKET: 64M
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - ctfd-net

  # -------------------------------------------------
  # Redis
  # -------------------------------------------------
  cache:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ctfd-redis
    restart: unless-stopped
    networks:
      - ctfd-net

  # The CTFd source image runs as UID 1001. This helper needs no network.
  source-permissions:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - ./ctfd/logs:/var/log/ctfd
      - ./ctfd/uploads:/var/uploads
    entrypoint: ["chown", "-R", "1001:1001", "/var/log/ctfd", "/var/uploads"]
    network_mode: "none"

networks:
  ctfd-net:
    driver: bridge
